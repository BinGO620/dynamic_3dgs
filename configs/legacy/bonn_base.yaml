# Legacy mapping core (MonoGS-derived, Phase A) — Bonn RGB-D base.
# Training hyperparams are the stock MonoGS rgbd/tum values (MonoGS has no
# Bonn preset; Bonn is TUM-format with distortion, handled by our loader).
abstract: true

Training:
  monocular: false
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  mapping_itr_num: 150
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 1
  window_size: 8
  rgb_boundary_threshold: 0.01
  alpha: 0.9
  kf_translation: 0.08
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_every_frame: true
  kf_cutoff: 0.3
  prune_mode: 'slam'
  color_refine_iters: 26000

opt_params:
  iterations: 30000
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

model_params:
  sh_degree: 0

Dataset:
  sensor_type: 'depth'
  pcd_downsample: 128
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.01

dataset:
  type: bonn
  path: datasets/bonn/PLACEHOLDER
  max_frames: -1
  eval_stride: 5
  train_views: -1
  max_dt: 0.02
  calibration:
    fx: 542.822841
    fy: 542.576870
    cx: 315.593520
    cy: 237.756098
    k1: 0.039903
    k2: -0.099343
    p1: -0.000730
    p2: -0.000144
    k3: 0.0
    distorted: True
    width: 640
    height: 480
    depth_scale: 5000.0

# Bonn base config — vanilla 3DGS offline baseline (GT pose + GT depth)
abstract: true  # template only, skipped by L1 gate
seed: 0
steps: 15000
init_stride: 4
sh_degree: 3
lr_means: 1.6e-4
lr_quats: 1.0e-3
lr_scales: 5.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
dssim_weight: 0.2
depth_weight: 0.15
# densification (vanilla 3DGS defaults via gsplat DefaultStrategy)
grow_grad2d: 0.0002
grow_scale3d: 0.01
prune_opa: 0.005
refine_every: 100
reset_opa_every: 3000

dataset:
  type: bonn
  path: datasets/bonn/PLACEHOLDER
  max_frames: -1
  eval_stride: 5
  max_dt: 0.02
  calibration:
    fx: 542.822841
    fy: 542.576870
    cx: 315.593520
    cy: 237.756098
    k1: 0.039903
    k2: -0.099343
    p1: -0.000730
    p2: -0.000144
    k3: 0.0
    distorted: True
    width: 640
    height: 480
    depth_scale: 5000.0

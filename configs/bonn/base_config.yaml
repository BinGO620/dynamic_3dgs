# Bonn base config — vanilla 3DGS offline baseline (GT pose + GT depth)
abstract: true  # template only, skipped by L1 gate
seed: 0
steps: 15000
init_stride: 4
init_voxel: 0.02  # voxel downsample (m); init cloud fuses ALL train views
sh_degree: 3
lr_means: 1.6e-4
lr_quats: 1.0e-3
lr_scales: 5.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
dssim_weight: 0.2
depth_weight: 0.15

# stage-0.5 protocol (Codex review + literature)
use_adc: false
static_filter: true
sc_refs: 4
sc_tol_base: 0.05
sc_tol_rel: 0.02
use_exposure: true
opacity_init: 0.1
lr_scales: 2.5e-3
final_lr_frac: 0.1
sh_ramp: true
scale_max: 0.08
densify_every: 250
densify_start: 2000
densify_max_px: 3000
densify_depth_thr: 0.2
densify_alpha_thr: 0.4
prune_every: 2000
prune_opa: 0.01
# stage-1 lifecycle gate (per-arm override: off | retire | full)
lifecycle: off
ev_tau: 0.15
retire_every: 1000
retire_ev: 0.2
retire_min_age: 2000
confirm_every: 1000
confirm_ev: 0.6

dataset:
  type: bonn
  path: datasets/bonn/PLACEHOLDER
  max_frames: -1
  eval_stride: 5
  train_views: 500   # fixed-count training views (each seen ~30x at 15k steps)
  max_dt: 0.02
  calibration:
    fx: 542.822841
    fy: 542.576870
    cx: 315.593520
    cy: 237.756098
    k1: 0.039903
    k2: -0.099343
    p1: -0.000730
    p2: -0.000144
    k3: 0.0
    distorted: True
    width: 640
    height: 480
    depth_scale: 5000.0
